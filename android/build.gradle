allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// -----------------------------------------------------------------------------
// PAKSA SEMUA SUBPROJECTS UNTUK MENGHAPUS -Werror DAN MENGGUNAKAN JAVA 17
// -----------------------------------------------------------------------------
subprojects {
    // 1. Matikan -Werror & sembunyikan warning obsolete Java 8
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"

        // Menghapus flag -Werror agar warning dari video_player_android tidak dianggap error
        options.compilerArgs.removeAll { it == "-Werror" || it == "-Werror=options" }
        options.compilerArgs << "-Xlint:-options"
        options.compilerArgs << "-Xlint:-deprecation"
    }

    // 2. Setel target Kotlin ke 17
    tasks.configureEach { task ->
        if (task.name.contains("Kotlin") || task.class.name.contains("KotlinCompile")) {
            try {
                task.compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            } catch (Exception e) {
                try {
                    task.kotlinOptions.jvmTarget = "17"
                } catch (Exception ignored) {}
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}