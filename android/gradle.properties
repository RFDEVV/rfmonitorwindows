org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true
# Silences the "source/target value 8 is obsolete" nag from legacy plugin
# javac invocations (e.g. video_player_android) under the Java 17 toolchain.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# Some plugins still compile Kotlin against an older JVM target than the
# app module's Java 17 - this stops Gradle failing the build over that
# mismatch instead of just warning about it.
kotlin.jvm.target.validation.mode=IGNORE