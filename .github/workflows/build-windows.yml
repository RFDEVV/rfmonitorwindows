name: Build Windows Release

env:
  FLUTTER_VERSION: '3.47.4'

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check toolchain
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $releaseExecutable = Get-ChildItem -Path "build\windows" `
            -Filter "rfmonitor.exe" -File -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if ($null -eq $releaseExecutable) {
            throw "Windows release executable was not produced."
          }
          $releaseDirectory = $releaseExecutable.DirectoryName
          $payloadDirectory = "build\installer\payload"
          New-Item -ItemType Directory -Path $payloadDirectory -Force | Out-Null
          Copy-Item -Path "$releaseDirectory\*" -Destination $payloadDirectory `
            -Recurse -Force

          $installerCompiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $installerCompiler)) {
            throw "Inno Setup compiler was not found at $installerCompiler."
          }
          & $installerCompiler "installer\RFMonitor.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "RFMonitor installer compilation failed."
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: RFMonitor-Windows-x64
          path: build/RFMonitor-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
